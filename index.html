<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AOC Web App</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f5f7fa;
      font-family: Arial, sans-serif;
    }

    .app-container {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .app-header {
      height: 55px;
      background: #ffffff;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      padding: 0 20px;
      font-size: 18px;
      font-weight: 600;
      color: #222;
      flex-shrink: 0;
    }

    .app-frame {
      width: 100%;
      height: calc(100vh - 55px);
      border: none;
      display: block;
      background: #ffffff;
    }

    @media (max-width: 768px) {
      .app-header {
        height: 48px;
        padding: 0 12px;
        font-size: 16px;
      }

      .app-frame {
        height: calc(100vh - 48px);
      }
    }
  </style>
</head>

<body>

  <div class="app-container">

    <div class="app-header">
      AOC Web App
    </div>

    <iframe
      class="app-frame"
      src="https://script.google.com/macros/s/AKfycbw3wMHIQh03oZPAF06TZHlFmD8IYjv6eh9jn5Yus6NH4wn6gofZqFJp3MHzChwOIv0bxg/exec"
      allow="fullscreen"
      loading="eager">
    </iframe>

  </div>

</body>
</html>
